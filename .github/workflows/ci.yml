name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-macos:
    name: "Swift ${{ matrix.swift }} on macOS"
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            xcode: "16.3"
            runner: macos-15
          - swift: "6.2"
            xcode: "26.0"
            runner: macos-26
          - swift: "6.3"
            xcode: "26.6"
            runner: macos-26
          - swift: "6.4"
            xcode: "27.0"
            runner: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Lint
        run: swift format lint --strict --recursive .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  test-macos-traits:
    name: "Swift 6.1 on macOS with trait ${{ matrix.trait }}"
    runs-on: macos-15
    env:
      DEVELOPER_DIR: "/Applications/Xcode_16.3.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        trait:
          - "noReader"
          - "noWriter"
          - "noIncrementalReader"
          - "noUtilities"
          - "noFastFloatingPoint"
          - "strictStandardJSON"
          - "noUTF8Validation"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-swift-6.1-spm-${{ hashFiles('**/Package.resolved') }}-${{ matrix.trait }}
          restore-keys: |
            ${{ runner.os }}-swift-6.1-spm-

      - name: Test
        run: swift test --traits ${{ matrix.trait }}

  test-linux:
    name: "Swift ${{ matrix.swift-version }} on Linux"
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift-version }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift-version:
          - "6.1"
          - "6.4"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint
        run: swift format lint --strict --recursive .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  test-linux-traits:
    name: "Swift 6.1 on Linux with trait ${{ matrix.trait }}"
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    strategy:
      fail-fast: false
      matrix:
        trait:
          - "noReader"
          - "noWriter"
          - "noIncrementalReader"
          - "noUtilities"
          - "noFastFloatingPoint"
          - "strictStandardJSON"
          - "noUTF8Validation"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        run: swift build --traits ${{ matrix.trait }}

      - name: Test
        run: swift test --traits ${{ matrix.trait }}
